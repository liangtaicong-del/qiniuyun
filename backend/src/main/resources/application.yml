server:
  port: 8080

spring:
  application:
    name: contenthub

  datasource:
    url: jdbc:h2:file:./data/contenthub
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: contenthub-jwt-secret-key-2024-very-long-and-secure
    expiration: 86400000
